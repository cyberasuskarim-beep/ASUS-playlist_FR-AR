name: Mise à jour uniquement des Radios

on:
  schedule:
    - cron: '0 3 * * *' # S'exécute automatiquement tous les jours à 3h00 UTC
  workflow_dispatch: # Permet de lancer la mise à jour manuellement depuis l'onglet Actions

jobs:
  update-radios-only:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Exécuter le script de mise à jour des radios
        run: python update_radios.py

      - name: Sauvegarder et commiter les modifications
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ASUS-playlist_FR-AR.m3u
          git diff --staged --quiet || git commit -m "Mise à jour automatique des radios uniquement [skip ci]"
          git push
