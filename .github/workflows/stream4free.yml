name: Update Isolated Stream4Free File

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Exécuter le script de mise à jour
        run: python update_stream4free.py

      - name: Forcer le Commit et le Push de stream4free.m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # S'assure que le fichier est pris en compte par git
          git add stream4free.m3u
          
          # Vérifie s'il y a des changements à commiter
          git status
          
          # Commit et envoi forcé sur le dépôt
          git commit -m "Mise à jour automatique de stream4free.m3u" || echo "Pas de changement à commiter"
          git push
