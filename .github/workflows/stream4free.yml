name: Update Isolated Stream4Free File

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests

      - name: Exécuter le script de mise à jour
        run: python update_stream4free.py

      - name: Commit et Push de stream4free.m3u
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Vérifie si le fichier existe avant de l'ajouter
          if [ -f "stream4free.m3u" ]; then
            git add stream4free.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stream4free.m3u isolated file" && git push)
          else
            echo "Le fichier stream4free.m3u n'a pas été généré, saut du commit."
          fi
